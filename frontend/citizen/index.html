<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nav.citizen">Citizen</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="citizen">
  <header class="app-header">
    <h1 data-i18n="app_title"></h1>
    <nav>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="az" data-i18n="lang.az"></button>
        <button type="button" data-lang="en" data-i18n="lang.en"></button>
      </div>
      <a href="/dispatcher/" data-i18n="nav.dispatcher"></a>
    </nav>
  </header>

  <div id="offline-notice" class="notice-offline" role="status" data-i18n="notice.offline_backup_routing" hidden></div>

  <div id="banner" class="banner" role="alert" hidden>
    <div>
      <strong id="banner-title"></strong>
      <p id="banner-text"></p>
      <p id="banner-target"></p>
    </div>
    <button type="button" id="banner-close" class="btn" data-i18n="banner.dismiss"></button>
  </div>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" role="application" data-i18n-aria="map.label"></div>
      <ul class="map-legend" data-i18n-aria="legend.title">
        <li><i class="lg-you"></i><span data-i18n="location.you"></span></li>
        <li><i class="lg-route"></i><span data-i18n="legend.route"></span></li>
        <li><i class="lg-shelter"></i><span data-i18n="legend.shelter"></span></li>
        <li><i class="lg-closed"></i><span data-i18n="legend.closed"></span></li>
      </ul>
    </section>

    <div class="panel">
      <section class="card status-strip" id="profile-card">
        <h2 class="sr-only" data-i18n="profile.title"></h2>
        <div class="toggle" role="group" data-i18n-aria="profile.title">
          <button type="button" class="btn" data-role="citizen" data-i18n="profile.citizen"></button>
          <button type="button" class="btn" data-role="priority_citizen" data-i18n="profile.priority"></button>
        </div>
        <span id="priority-badge" class="badge" data-i18n="profile.badge" hidden></span>
      </section>

      <section class="card route-card" id="route-card">
        <h2 data-i18n="route.title"></h2>
        <div id="route-body"></div>
      </section>

      <section class="card" id="sos-card">
        <h2 data-i18n="sos.title"></h2>
        <p class="hint" data-i18n="sos.hint"></p>
        <div id="sos-buttons" class="sos-grid">
          <button type="button" class="sos-btn hz-fire" data-hazard="fire"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.4 1.2-4 2.5-5.2.3 1.8 1.2 2.9 2.3 3.4C11 8.6 11.3 5 12 2z"/></svg></span><span data-i18n="hazard.fire"></span></button>
          <button type="button" class="sos-btn hz-collapse" data-hazard="collapse"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l7-5 7 5v3l-3 2 2 2-3 2 1 3H3zm4-8v3h3v-3H7zm12 1 2 1-1 6h-2l1-4-2-1 2-2z"/></svg></span><span data-i18n="hazard.collapse"></span></button>
          <button type="button" class="sos-btn hz-flood" data-hazard="flood"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s-5 6-5 9a5 5 0 0 0 10 0c0-3-5-9-5-9zM2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5V20c-2 0-2 1.5-4 1.5S16 20 14 20s-2 1.5-4 1.5S8 20 6 20s-2 1.5-4 1.5z"/></svg></span><span data-i18n="hazard.flood"></span></button>
          <button type="button" class="sos-btn hz-medical" data-hazard="medical"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span data-i18n="hazard.medical"></span></button>
        </div>
        <div id="sos-active" class="sos-active" hidden>
          <h3 data-i18n="sos.active_title"></h3>
          <p id="sos-active-hazard"></p>
          <p id="sos-active-time" class="small"></p>
          <p id="sos-active-priority"></p>
          <button type="button" id="safe-btn" class="btn btn-safe" data-i18n="sos.safe_btn"></button>
        </div>
      </section>

      <section class="card" id="location-card">
        <h2 data-i18n="location.title"></h2>
        <div class="row">
          <button type="button" id="locate-btn" class="btn btn-primary" data-i18n="location.use_mine"></button>
          <select id="district-select" class="btn" data-i18n-aria="location.district">
            <option value="" data-i18n="location.district"></option>
          </select>
        </div>
        <p class="hint" data-i18n="location.hint"></p>
      </section>

      <section class="card" id="nearest-card">
        <h2 data-i18n="nearest.title"></h2>
        <p class="hint" data-i18n="nearest.pick_hint"></p>
        <ul id="nearest-list" class="shelter-list"></ul>
      </section>
    </div>
  </main>

  <a href="#sos-card" class="sos-fab" data-i18n-aria="sos.title">SOS</a>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/citizen.js"></script>
</body>
</html>
