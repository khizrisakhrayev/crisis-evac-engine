<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nav.dispatcher">Dispatcher</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="theme-dark">
  <header class="app-header">
    <h1><span data-i18n="app_title"></span> · <span data-i18n="dash.title"></span></h1>
    <nav>
      <span id="conn-chip" class="chip chip-warn"></span>
      <span id="routing-chip" class="chip chip-ok"></span>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="az" data-i18n="lang.az"></button>
        <button type="button" data-lang="en" data-i18n="lang.en"></button>
      </div>
      <a href="/" data-i18n="nav.citizen"></a>
      <button type="button" id="logout" class="btn btn-small" data-i18n="login.logout" hidden></button>
    </nav>
  </header>

  <div id="login" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <h2 data-i18n="login.title"></h2>
      <p class="hint" data-i18n="login.hint"></p>
      <label><span data-i18n="login.username"></span>
        <input id="login-user" name="username" autocomplete="username" required></label>
      <label><span data-i18n="login.password"></span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary" data-i18n="login.submit"></button>
    </form>
  </div>

  <main class="dash">
    <section id="red-alerts" class="red-alert-area" aria-live="assertive"></section>

    <section class="kpis">
      <div class="kpi" id="kpi-active"><div class="value"></div><div class="label" data-i18n="kpi.active_sos"></div></div>
      <div class="kpi" id="kpi-priority"><div class="value"></div><div class="label" data-i18n="kpi.priority_sos"></div></div>
      <div class="kpi" id="kpi-alerts"><div class="value"></div><div class="label" data-i18n="kpi.open_alerts"></div></div>
      <div class="kpi" id="kpi-brigades"><div class="value"></div><div class="label" data-i18n="kpi.brigades"></div></div>
      <div class="kpi" id="kpi-occupancy"><div class="value"></div><div class="label" data-i18n="kpi.avg_occupancy"></div></div>
      <div class="kpi kpi-flood" id="kpi-flood"><div class="value"></div><div class="label" data-i18n="kpi.flood"></div><div class="sub small"></div></div>
    </section>

    <section class="dash-grid">
      <div class="map-wrap">
        <div id="dmap" role="application" data-i18n-aria="map.label"></div>
        <div id="evac-bar" class="evac-bar" role="status" hidden>
          <span class="evac-dot" aria-hidden="true"></span>
          <span id="evac-text"></span>
          <button type="button" id="evac-stop" class="btn btn-small" data-i18n="evac.stop"></button>
        </div>
        <ul class="map-legend" data-i18n-aria="legend.title">
          <li><i class="lg-sos"></i><span data-i18n="legend.sos"></span></li>
          <li><i class="lg-sos-prio"></i><span data-i18n="legend.sos_priority"></span></li>
          <li><i class="lg-shelter"></i><span data-i18n="legend.shelter"></span></li>
          <li><i class="lg-closed"></i><span data-i18n="legend.closed"></span></li>
          <li><i class="lg-cluster"></i><span data-i18n="legend.cluster"></span></li>
          <li><i class="lg-walker"></i><span data-i18n="legend.walker"></span></li>
        </ul>
      </div>
      <div class="dash-side">
        <section class="card">
          <h2 data-i18n="panel.sos"></h2>
          <ul id="sos-feed" class="feed scroll"></ul>
        </section>
        <section class="card">
          <h2 data-i18n="panel.shelters"></h2>
          <p class="hint" data-i18n="shelter.ticks"></p>
          <ul id="shelter-list" class="feed scroll"></ul>
        </section>
        <section class="card">
          <h2 data-i18n="panel.brigades"></h2>
          <ul id="brigade-list" class="feed scroll"></ul>
        </section>
        <section class="card">
          <h2 data-i18n="panel.zones"></h2>
          <table class="data-table">
            <thead><tr>
              <th data-i18n="zones.zone"></th>
              <th class="num" data-i18n="zones.active"></th>
              <th class="num" data-i18n="zones.priority"></th>
            </tr></thead>
            <tbody id="zone-rows"></tbody>
          </table>
        </section>
        <section class="card">
          <h2 data-i18n="panel.history"></h2>
          <ul id="alert-history" class="feed scroll"></ul>
        </section>
        <details id="sim" class="sim">
          <summary data-i18n="sim.title"></summary>
          <p class="hint" data-i18n="sim.point_hint"></p>
          <div class="row" role="group" data-i18n-aria="sim.mode">
            <span data-i18n="sim.mode"></span>
            <button type="button" id="sim-mode-point" class="btn" data-i18n="sim.mode_point"></button>
            <button type="button" id="sim-mode-roads" class="btn" data-i18n="sim.mode_roads"></button>
          </div>
          <p id="sim-point" class="small"></p>
          <div class="sim-grid">
            <fieldset>
              <legend data-i18n="evac.title"></legend>
              <div class="row">
                <label><span data-i18n="evac.citizens"></span>
                  <input id="evac-count" type="number" min="1" max="500" value="150"></label>
                <label><span data-i18n="evac.speed"></span>
                  <input id="evac-speed" type="number" min="1" max="200" value="20"></label>
              </div>
              <button type="button" id="evac-run" class="btn btn-primary" data-i18n="evac.run"></button>
            </fieldset>
            <fieldset>
              <legend data-i18n="sim.burst"></legend>
              <label><span data-i18n="sim.hazard"></span>
                <select id="sim-hazard">
                  <option value="fire" data-i18n="hazard.fire"></option>
                  <option value="collapse" data-i18n="hazard.collapse"></option>
                  <option value="flood" data-i18n="hazard.flood"></option>
                  <option value="medical" data-i18n="hazard.medical"></option>
                </select>
              </label>
              <label><span data-i18n="sim.count"></span>
                <input id="sim-count" type="number" min="1" max="20" value="4">
              </label>
              <button type="button" id="sim-burst" class="btn btn-primary" data-i18n="sim.send_burst"></button>
              <button type="button" id="sim-priority" class="btn" data-i18n="sim.priority_sos"></button>
            </fieldset>
            <fieldset>
              <legend data-i18n="sim.occupancy"></legend>
              <label><span data-i18n="sim.shelter"></span>
                <select id="sim-shelter"></select>
              </label>
              <label><span id="sim-pct-label"></span>
                <input id="sim-pct" type="range" min="0" max="100" step="1" value="50">
              </label>
              <button type="button" id="sim-apply" class="btn btn-primary" data-i18n="sim.apply"></button>
            </fieldset>
            <fieldset>
              <legend data-i18n="sim.routing"></legend>
              <div class="row">
                <button type="button" id="sim-ext-up" class="btn" data-i18n="sim.up"></button>
                <button type="button" id="sim-ext-down" class="btn" data-i18n="sim.down"></button>
                <button type="button" id="sim-ext-slow" class="btn" data-i18n="sim.slow"></button>
              </div>
              <button type="button" id="sim-reset" class="btn" data-i18n="sim.reset"></button>
            </fieldset>
          </div>
        </details>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/dispatcher/dispatcher.js"></script>
</body>
</html>
